<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>'Aula 07 - Introdução ao JavaScript'</title>

    <style>
        body{
            background-color: #9ed6a1;
        }
    </style>
</head>
<body>
    <h1>Introdução ao Javascript</h1>
</body>

<!-- JAVASCRIPT -->
<script>
    //Dispare uma janela de ALERTA
    window.alert('Bem-vindo ao meu primeiro site com Javascript!')

    // No JS, é manipulado a árvore DOM, que começa com o pai WINDOW,
    // vai para filho DOCUMENT(site) que possui o html, head, body, etc

    //Dispara uyma janea de CONFIRMAÇÃO
    window.confirm('Vamos começar a aprender sobre variáveis?')

    //Armazenando o nome do usuário em uma variável
    const nome = window.prompt('Qual é o seu nome?')
    //prompt -> abre uma janela de inserção de dados 

    //Escrevendo no site
    document.write('Olá ' + nome + '! Vamos aprender sobre variáveis!')

    // Quebra linha  -->  document.write('<br>')
   
    document.write('<br>')

    let idade = window.prompt('Qual é a sua idade?')
    document.write('Atualmente, sua idade é ' + idade + ' anos!')

    // o var subscreve o valor da variável, já o let não permite que a variável seja sobrescrita (se você tem um valor importante o var pode acabar apagando)

</script>

</html>
