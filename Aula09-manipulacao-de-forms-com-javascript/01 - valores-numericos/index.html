<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Importação do CSS -->
    <link rel="stylesheet" href="style.css">

    <title>Manipulação de Formulários com Javascript</title>

</head>
<body>

    <h1>Calculadora com Javascript</h1>

    <input type = "number" name = "inputN1" id = "inputN1" min = "0" max = "999">
    <input type = "number" name = "inputN2" id = "inputN2" min = "0" max = "999">
    <br><br>
    <!-- Botão Somar -->
    <button type = "button" onclick = "somar()">Somar</button>

    <!-- Botão Limpar -->
    <button type = "button" onclick = "limpar()">Limpar</button>

    <!-- Resultado -->
     <div id = "resultado">=</div>

    <!-- Importação do Javascript -->
    <script src="script.js"></script>
</body>
</html>
